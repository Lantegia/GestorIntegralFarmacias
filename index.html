<head>

    <title>Gestor Integral de Farmacias</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZvKRt7TlgTbzVhWOhcwJ1Ogau4lyYjI8",
            authDomain: "gestor-integral-farmacias.firebaseapp.com",
            projectId: "gestor-integral-farmacias",
            storageBucket: "gestor-integral-farmacias.firebasestorage.app",
            messagingSenderId: "803337236496",
            appId: "1:803337236496:web:cebb99b9c0f5e518049a95"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        let enterprisePassphrase = "";

        function bytesToBase64(bytes) {
            let binary = "";
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
            }
            return btoa(binary);
        }

        function base64ToBytes(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        async function deriveEnterpriseAesKey(passphrase, salt) {
            const keyMaterial = await crypto.subtle.importKey(
                "raw",
                new TextEncoder().encode(passphrase.trim().toUpperCase()),
                "PBKDF2",
                false,
                ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptEnterprisePayload(dataObj, passphrase) {
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await deriveEnterpriseAesKey(passphrase, salt);
            const encoded = new TextEncoder().encode(JSON.stringify(dataObj));
            const cipherBuf = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
            return {
                v: 1,
                salt: bytesToBase64(salt),
                iv: bytesToBase64(iv),
                ciphertext: bytesToBase64(new Uint8Array(cipherBuf))
            };
        }

        async function decryptEnterprisePayload(encObj, passphrase) {
            const salt = base64ToBytes(encObj.salt);
            const iv = base64ToBytes(encObj.iv);
            const ciphertext = base64ToBytes(encObj.ciphertext);
            const key = await deriveEnterpriseAesKey(passphrase, salt);
            const plainBuf = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
            return JSON.parse(new TextDecoder().decode(plainBuf));
        }

        window.saveToFirebase = async function() {
            const user = auth.currentUser;
            if (!user) {
                alert("Debes iniciar sesión con Google para guardar en la nube.");
                return;
            }
            if (!confirm("¿Estás seguro de continuar con el guardado en la nube?")) {
                return;
            }
            try {
                // 1. Save private technician data (visits) under personal user document
                const userDocRef = doc(db, "usuarios_datos", user.uid);
                const privatePharmacies = appState.pharmacies.filter(f => Array.isArray(f.visitas) && f.visitas.length > 0).map(f => ({
                    id: f.id,
                    nombre: f.nombre,
                    visitas: f.visitas || []
                }));

                const payload = {
                    globalTechnician: appState.globalTechnician,
                    pharmacies: privatePharmacies
                };

                await setDoc(userDocRef, payload, { merge: true });

                // 2. Save shared corporate enterprise data in shared collection when enterprise mode is unlocked
                if (appState.enterpriseUnlocked) {
                    const corporateData = {};
                    appState.pharmacies.forEach(f => {
                        const normSoft = typeof normalizeSoftwareValue === 'function' ? normalizeSoftwareValue(f.software || "") : (f.software || "");
                        const normDist = typeof normalizeDistributorValue === 'function' ? normalizeDistributorValue(f.distribuidor || "") : (f.distribuidor || "");
                        f.software = normSoft;
                        f.distribuidor = normDist;

                        const realAudits = Array.isArray(f.auditorias) ? f.auditorias.filter(a => a.configuracion && a.configuracion.puestosSelector && a.configuracion.puestosSelector !== "") : [];
                        corporateData[f.id] = {
                            id: f.id,
                            nombre: f.nombre || "",
                            titular: f.titular || "",
                            cif: f.cif || "",
                            codigo_oficial: f.codigo_oficial || f.id || "",
                            direccion: f.direccion || "",
                            localidad: f.localidad || "",
                            zona: f.zona || "",
                            lat: f.lat ?? null,
                            lng: f.lng ?? null,
                            telefono: f.telefono || "",
                            email: f.email || "",
                            logistica: Boolean(f.logistica),
                            informatica: Boolean(f.informatica),
                            codigo_logistica: f.codigo_logistica || "",
                            codigo_informatica: f.codigo_informatica || "",
                            software: normSoft,
                            distribuidor: normDist,
                            agrupacion: f.agrupacion || "",
                            observaciones: f.observaciones || "",
                            auditorias: realAudits
                        };
                    });
                    if (!enterprisePassphrase) {
                        const pass = prompt("Introduce la clave de empresa para cifrar y guardar en la nube:");
                        if (!pass || !(await window.verifyHash(pass, window.H_CORP))) {
                            alert("Clave incorrecta. No se guardaron los datos de empresa.");
                            return;
                        }
                        enterprisePassphrase = pass.trim().toUpperCase();
                    }
                    const corpDocRef = doc(db, "empresa_datos", "navarra");
                    const encryptedPayload = await encryptEnterprisePayload(corporateData, enterprisePassphrase);
                    await setDoc(corpDocRef, {
                        encrypted: encryptedPayload,
                        updatedAt: new Date().toISOString(),
                        updatedBy: user.email || user.uid
                    });
                }

                appState.hasUnsavedChanges = false;
                showCheckPopup();
            } catch (e) {
                console.error("Firestore save error:", e);
                alert("Error al guardar en la nube: " + (e.message || e));
            }
        };

        window.loadFromFirebase = async function() {
            const user = auth.currentUser;
            if (!user) return;
            try {
                // Ensure master catalog is initialized before merging cloud data
                if (appState.pharmacies.length === 0 && typeof initMasterPharmacies === 'function') {
                    initMasterPharmacies();
                }

                // 1. Load personal user document (visits)
                const userDocRef = doc(db, "usuarios_datos", user.uid);
                const docSnap = await getDoc(userDocRef);
                let legacyUserCorpData = null;
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.globalTechnician) {
                        appState.globalTechnician = data.globalTechnician;
                        const techInput = document.getElementById('globalTechnicianInput');
                        if (techInput) techInput.value = data.globalTechnician;
                    }
                    if (Array.isArray(data.pharmacies)) {
                        mergeLoadedPharmacies(data.pharmacies);
                    }
                    if (data.empresa_datos) {
                        legacyUserCorpData = data.empresa_datos;
                    }
                }

                // 2. Load legacy per-user corporate data first (if any), then merge shared corporate enterprise overlay
                if (appState.enterpriseUnlocked) {
                    if (legacyUserCorpData) {
                        mergeCorporateData(legacyUserCorpData);
                    }
                    try {
                        const corpDocRef = doc(db, "empresa_datos", "navarra");
                        const corpSnap = await getDoc(corpDocRef);
                        if (corpSnap.exists()) {
                            const corpRaw = corpSnap.data();
                            let corpMap = null;
                            if (corpRaw && corpRaw.encrypted && corpRaw.encrypted.ciphertext && enterprisePassphrase) {
                                corpMap = await decryptEnterprisePayload(corpRaw.encrypted, enterprisePassphrase);
                            } else if (corpRaw && corpRaw.datos && typeof corpRaw.datos === 'object') {
                                corpMap = corpRaw.datos;
                            } else if (corpRaw && !corpRaw.encrypted) {
                                corpMap = corpRaw;
                            }
                            if (corpMap && Object.keys(corpMap).length > 0) {
                                mergeCorporateData(corpMap);
                            }
                        }
                    } catch (corpErr) {
                        console.warn("Could not read empresa_datos/navarra:", corpErr);
                    }
                }

                appState.selectedPharmacyId = null;
                appState.hasUnsavedChanges = false;
                showCheckPopup();
                if (typeof updateMapCounters === 'function') updateMapCounters();
                if (typeof renderWorkspace === 'function') renderWorkspace();
            } catch (e) {
                console.error("Firestore load error:", e);
            }
        };

        function renderAuthContainer(user) {
            const authContainer = document.getElementById('authContainer');
            if (!authContainer) return;
            const isEmp = !!appState.enterpriseUnlocked;
            if (user) {
                authContainer.innerHTML = `
                    <button type="button" id="btnToggleEnterprise" class="${isEmp ? 'btn-light' : 'btn-secondary'}" 
                        title="${isEmp ? 'Datos de empresa activos (clic para ocultar)' : 'Activar datos de empresa con clave'}" 
                        style="height: var(--control-h); padding: 0 12px; font-size: 0.75rem; letter-spacing: 0.5px; white-space: nowrap; font-weight: 700; width: auto; min-width: unset;">Empresa</button>
                    <button type="button" id="btnCloudSave" class="btn-light" title="Guardar en la nube (${user.email})" style="height: var(--control-h); min-width: var(--control-h); width: var(--control-h); padding: 0; display: flex; align-items: center; justify-content: center;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                    </button>
                    <button type="button" id="btnCloudLogout" class="btn-danger" title="Cerrar sesión" style="height: var(--control-h); min-width: var(--control-h); width: var(--control-h); padding: 0; display: flex; align-items: center; justify-content: center;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                    </button>
                `;
                document.getElementById('btnCloudSave').onclick = saveToFirebase;
                document.getElementById('btnCloudLogout').onclick = () => {
                    signOut(auth).then(() => {
                        appState.enterpriseUnlocked = false;
                        enterprisePassphrase = "";
                        sessionStorage.removeItem('empresaPrompted');
                        initMasterPharmacies();
                        appState.selectedPharmacyId = null;
                        appState.globalTechnician = "";
                        const techInput = document.getElementById('globalTechnicianInput');
                        if (techInput) techInput.value = "";
                        if (typeof updateActionButtonsState === 'function') updateActionButtonsState();
                        if (typeof updateMapCounters === 'function') updateMapCounters();
                        if (typeof renderWorkspace === 'function') renderWorkspace();
                    });
                };
            } else {
                authContainer.innerHTML = `
                    <button type="button" id="btnToggleEnterprise" class="${isEmp ? 'btn-light' : 'btn-secondary'}" 
                        title="${isEmp ? 'Datos de empresa activos (clic para ocultar)' : 'Activar datos de empresa con clave'}" 
                        style="height: var(--control-h); padding: 0 12px; font-size: 0.75rem; letter-spacing: 0.5px; white-space: nowrap; font-weight: 700; width: auto; min-width: unset;">Empresa</button>
                    <button type="button" id="btnLoginGoogle" class="btn-light" title="Iniciar sesión con Google" style="height: var(--control-h); padding: 0 12px; font-size: 0.75rem; letter-spacing: 0.5px; white-space: nowrap; font-weight: 700; width: auto; min-width: unset;">Google Login</button>
                `;
                document.getElementById('btnLoginGoogle').onclick = async () => {
                    try {
                        sessionStorage.removeItem('empresaPrompted');
                        await signInWithPopup(auth, provider);
                    } catch (error) {
                        console.error("Error en login con pop-up:", error);
                    }
                };
            }

            const btnToggle = document.getElementById('btnToggleEnterprise');
            if (btnToggle) {
                btnToggle.onclick = async () => {
                    if (appState.enterpriseUnlocked) {
                        if (confirm("¿Desactivar y ocultar datos de empresa?")) {
                            appState.enterpriseUnlocked = false;
                            enterprisePassphrase = "";
                            initMasterPharmacies();
                            if (auth.currentUser) await loadFromFirebase();
                            renderAuthContainer(auth.currentUser);
                            if (typeof updateMapCounters === 'function') updateMapCounters();
                            if (typeof renderWorkspace === 'function') renderWorkspace();
                        }
                    } else {
                        const pass = prompt("Introduce la clave para activar los datos de empresa:");
                        if (pass && await window.verifyHash(pass, window.H_CORP)) {
                            appState.enterpriseUnlocked = true;
                            enterprisePassphrase = pass.trim().toUpperCase();
                            renderAuthContainer(auth.currentUser);
                            if (auth.currentUser) await loadFromFirebase();
                            if (typeof updateMapCounters === 'function') updateMapCounters();
                            if (typeof renderWorkspace === 'function') renderWorkspace();
                        } else if (pass !== null) {
                            alert("Clave incorrecta.");
                        }
                    }
                };
            }
            if (typeof updateActionButtonsState === 'function') updateActionButtonsState();
        }
        window.renderAuthContainer = renderAuthContainer;
        window.firebaseAuth = auth;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                if (!appState.enterpriseUnlocked && sessionStorage.getItem('empresaPrompted') !== 'true') {
                    sessionStorage.setItem('empresaPrompted', 'true');
                    const pass = prompt("Introduce la clave para activar los datos de empresa (o pulsa Cancelar para modo estándar):");
                    if (pass && await window.verifyHash(pass, window.H_CORP)) {
                        appState.enterpriseUnlocked = true;
                        enterprisePassphrase = pass.trim().toUpperCase();
                    }
                }
                renderAuthContainer(user);
                await loadFromFirebase();
            } else {
                sessionStorage.removeItem('empresaPrompted');
                appState.enterpriseUnlocked = false;
                renderAuthContainer(null);
            }
        });
    </script>
    
    <style>

            color-scheme: dark;

            --border-focus: #f4f4f5;     
            --text-main: #fcfcfc;

            --accent: #f4f4f5;           
            --accent-text: #18181b;      
            --radius: 6px;               
            --control-h: clamp(30px, 3.6vh, 34px);

            color: var(--text-main);
            font-size: 3rem;
            padding: 24px 40px;
            border-radius: var(--radius);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popupFadeOut 1.3s ease-in-out forwards;
        }

        .custom-scrollbar, textarea {
            scrollbar-width: thin;
            scrollbar-color: var(--border) var(--card-bg);
            transition: scrollbar-color 0.3s ease;
        }
        .custom-scrollbar::-webkit-scrollbar, textarea::-webkit-scrollbar {
            width: 6px;
            height: 6px;

            background: var(--card-bg);
            border-radius: var(--radius);

            background: var(--border);
            border-radius: var(--radius);

            display: none;
            width: 0;
            height: 0;

            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 10px 12px;

        .badges-container {

<script>
    
    // Master data loaded from external dataset (FarmaciasNavarra.js / FarmaciasNavarra.json)
    if (typeof MASTER_NAVARRA_PHARMACIES === 'undefined') {
        window.MASTER_NAVARRA_PHARMACIES = [];
        fetch('FarmaciasNavarra.json')
            .then(res => res.json())
            .then(data => {
                window.MASTER_NAVARRA_PHARMACIES = data;
                if (appState.pharmacies.length === 0) {
                    initMasterPharmacies();
                    renderWorkspace();
                }
            })
            .catch(e => console.log('Waiting for local data load...'));
    }

    let mapInstance = null;
    let markersCluster = null;
    let markersMap = {};
    let tileLayers = {};
    let currentTileLayer = null;
    let currentMapLayerMode = 'dark';
    let mapFilterLogistica = false;
    let mapFilterInformatica = false;
    let mapFilterDistributor = '';
    let mapFilterSoftware = '';
    let mapFilterVisit = '';

    function getVisitSortKey(v) {
        const d = (v && v.fecha) ? String(v.fecha).trim() : '0000-00-00';
        const h = (v && v.hora && String(v.hora).trim()) ? String(v.hora).trim() : '00:00';
        return `${d} ${h}`;
    }

    function compareVisitsDesc(a, b) {
        const ka = getVisitSortKey(a);
        const kb = getVisitSortKey(b);
        if (kb !== ka) return kb.localeCompare(ka);
        return (Number(b && b.id) || 0) - (Number(a && a.id) || 0);
    }

    function getLatestVisitInfo(p) {
        if (!p || !Array.isArray(p.visitas) || p.visitas.length === 0) return null;
        const sorted = p.visitas.slice().sort(compareVisitsDesc);
        const latest = sorted[0];
        let daysAgo = null;
        if (latest && latest.fecha) {
            const parts = String(latest.fecha).split('-').map(Number);
            if (parts.length === 3 && !parts.some(isNaN)) {
                const visitDate = new Date(parts[0], parts[1] - 1, parts[2]);
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                daysAgo = Math.max(0, Math.floor((today - visitDate) / 86400000));
            }
        }
        return {
            fecha: latest.fecha || '',
            hora: latest.hora || '',
            count: p.visitas.length,
            daysAgo
        };
    }

    // Official Spanish Pharmaceutical Distributors Catalog (Strictly ordered A-Z, with 'Otro' at the end)
    const DISTRIBUTORS_CATALOG = [
        { name: "", url: "" },
        { name: "Alliance Healthcare", url: "https://www.alliance-healthcare.es" },
        { name: "Bidafarma", url: "https://www.bidafarma.es" },
        { name: "Cofano", url: "https://www.cofano.org" },
        { name: "Cofarca", url: "https://www.cofarca.es" },
        { name: "Cofares", url: "https://www.cofares.es" },
        { name: "Cofarme", url: "https://www.cofarme.com" },
        { name: "Cofarte", url: "https://www.cofarte.es" },
        { name: "Cofas", url: "https://www.cofas.es" },
        { name: "DFG (Guipuzcoana)", url: "https://www.dfgip.es" },
        { name: "Directo Laboratorio", url: "" },
        { name: "Fedefarma", url: "https://www.fedefarma.com" },
        { name: "Hefame", url: "https://www.hefame.es" },
        { name: "Nafarco", url: "https://www.nafarco.com" },
        { name: "Novaltia", url: "https://www.novaltia.es" },
        { name: "Otro", url: "" }
    ];

    // Official Spanish Pharmacy Management ERP Software Catalog (Strictly ordered A-Z, with 'Otro' at the end)
    const SOFTWARE_CATALOG = [
        { name: "", url: "" },
        { name: "Bitfarma", url: "https://www.bitfarma.com" },
        { name: "Farmagest", url: "" },
        { name: "Farmanager", url: "https://www.farmanager.es" },
        { name: "Farmatic", url: "https://www.glinttlife.com/es/farmacias/" },
        { name: "Farmawin", url: "" },
        { name: "In-Sfera", url: "https://www.sferafarmacia.com" },
        { name: "IOFwin", url: "https://www.fedefarma.com" },
        { name: "Nixfarma", url: "https://www.nixfarma.es" },
        { name: "Sigefar", url: "" },
        { name: "Unycop Win", url: "https://www.unycop.es" },
        { name: "Vinfar", url: "" },
        { name: "Otro", url: "" }
    ];

    function normalizeSoftwareValue(raw) {
        if (!raw || typeof raw !== 'string') return "";
        const val = raw.trim();
        if (!val) return "";
        const lower = val.toLowerCase().replace(/\s+/g, ' ');
        const directMatch = SOFTWARE_CATALOG.find(c => c.name && c.name.toLowerCase() === lower);
        if (directMatch) return directMatch.name;

        if (lower.includes('bitfarma') || lower.includes('bit farma')) return "Bitfarma";
        if (lower.includes('farmagest')) return "Farmagest";
        if (lower.includes('farmanager')) return "Farmanager";
        if (lower.includes('farmatic')) return "Farmatic";
        if (lower.includes('farmawin')) return "Farmawin";
        if (lower.includes('in-sfera') || lower.includes('insfera') || lower.includes('in sfera') || lower.includes('unisfar')) return "In-Sfera";
        if (lower.includes('iofwin') || lower.includes('iof win')) return "IOFwin";
        if (lower.includes('nixfarma') || lower.includes('nix farma')) return "Nixfarma";
        if (lower.includes('sigefar')) return "Sigefar";
        if (lower.includes('unycop')) return "Unycop Win";
        if (lower.includes('vinfar')) return "Vinfar";
        return val;
    }
    window.normalizeSoftwareValue = normalizeSoftwareValue;

    function normalizeDistributorValue(raw) {
        if (!raw || typeof raw !== 'string') return "";
        const val = raw.trim();
        if (!val) return "";
        const lower = val.toLowerCase().replace(/\s+/g, ' ');
        const directMatch = DISTRIBUTORS_CATALOG.find(c => c.name && c.name.toLowerCase() === lower);
        if (directMatch) return directMatch.name;

        if (lower.includes('alliance')) return "Alliance Healthcare";
        if (lower.includes('bidafarma')) return "Bidafarma";
        if (lower.includes('cofano')) return "Cofano";
        if (lower.includes('cofarca')) return "Cofarca";
        if (lower.includes('cofares')) return "Cofares";
        if (lower.includes('cofarme')) return "Cofarme";
        if (lower.includes('cofarte')) return "Cofarte";
        if (lower.includes('cofas')) return "Cofas";
        if (lower.includes('dfg') || lower.includes('guipuzcoana')) return "DFG (Guipuzcoana)";
        if (lower.includes('directo')) return "Directo Laboratorio";
        if (lower.includes('fedefarma')) return "Fedefarma";
        if (lower.includes('hefame')) return "Hefame";
        if (lower.includes('nafarco')) return "Nafarco";
        if (lower.includes('novaltia') || lower.includes('aragofar') || lower.includes('vascofar')) return "Novaltia";
        return val;
    }
    window.normalizeDistributorValue = normalizeDistributorValue;

    function getCatalogUrl(catalog, name) {
        if (!name) return "";
        const found = catalog.find(c => c.name.toLowerCase() === name.trim().toLowerCase());
        return found && found.url ? found.url : "";
    }

    function openCatalogWebsite(type, selectId) {
        const el = document.getElementById(selectId);
        const val = el ? el.value : "";
        const catalog = type === 'distributor' ? DISTRIBUTORS_CATALOG : SOFTWARE_CATALOG;
        const url = getCatalogUrl(catalog, val);
        if (url) {
            window.open(url, '_blank', 'noopener,noreferrer');
        }
    }

    function openAppInfoModal() {
        const existing = document.getElementById('modalAppInfo');
        if (existing) {
            existing.remove();
            return;
        }
        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal-overlay';
        modalDiv.id = 'modalAppInfo';
        modalDiv.onclick = (e) => {
            if (e.target === modalDiv) modalDiv.remove();
        };
        modalDiv.innerHTML = `
            <div class="modal-content" style="max-width: 480px;">
                <div class="section-title" style="margin-bottom: 14px;">
                    <div class="section-title-header">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        <span>Información y Estructura de Datos</span>
                    </div>
                </div>

                <div class="info-guide-block">
                    <div class="info-guide-title">

    async function verifyHash(input, targetHash) {
        if (!input) return false;
        try {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(input.trim().toUpperCase()));
            const h = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
            return h === targetHash;
        } catch (e) {
            console.error("Crypto error:", e);
            return false;
        }
    }
    window.verifyHash = verifyHash;

    function formatToApellidosNombre(str) {
        if (!str) return '';
        str = str.trim();
        // Preserve official format if string already includes a comma ("Surnames, Name")
        if (str.includes(',')) {
            return str.replace(/^\s*\/+\s*/, '').trim();
        }
        const words = str.split(/\s+/);
        if (words.length <= 1) return str;
        const name = words[0];
        const surnames = words.slice(1).join(' ');
        return `${surnames}, ${name}`.replace(/^\s*\/+\s*/, '').trim();
    }

    function normalizeWords(str) {
        if (!str) return [];
        return str.toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]/g, " ")
            .split(" ")
            .filter(w => w.length > 2);
    }

    function mergeIncomingPharmacy(nf) {
        if (!nf) return;
        ensureAuditStructure(nf);

        let existing = appState.pharmacies.find(ex => String(ex.id) === String(nf.id));
        const nfCode = (nf.codigo_cliente || nf.codigo_logistica || nf.codigo || "").trim().toUpperCase();
        const nfWords = normalizeWords(nf.nombre || nf.titular || "");

        // 1. Match by client code if available
        if (!existing && nfCode) {
            existing = appState.pharmacies.find(ex => {
                const exCode = (ex.codigo_cliente || ex.codigo_logistica || "").trim().toUpperCase();
                const exOfi = (ex.codigo_oficial || ex.id || "").trim().toUpperCase();
                return (exCode && exCode === nfCode) || exOfi === nfCode;
            });
        }

        // 2. Fuzzy match by name/owner keywords
        if (!existing && nfWords.length > 0) {
            let maxOverlap = 0;
            let candidate = null;

            appState.pharmacies.forEach(ex => {
                const exWords = normalizeWords(ex.nombre || ex.titular || "");
                const overlap = nfWords.filter(w => exWords.includes(w)).length;
                if (overlap > maxOverlap && (overlap >= 2 || (nfWords.length === 1 && overlap === 1))) {
                    maxOverlap = overlap;
                    candidate = ex;
                }
            });

            if (candidate && maxOverlap >= Math.min(2, nfWords.length)) {
                existing = candidate;
            }
        }

        if (existing) {
            // MERGE: Update visits and user observations on existing official catalog record
            if (nf.visitas && nf.visitas.length > 0) existing.visitas = nf.visitas;
            if (nf.observaciones !== undefined && nf.observaciones.trim() !== "") {
                existing.observaciones = nf.observaciones;
            }
            if (appState.enterpriseUnlocked || nf.logistica || nf.informatica || nf.software) {
                if (nf.nombre) existing.nombre = nf.nombre;
                if (nf.titular) existing.titular = nf.titular;
                if (nf.cif) existing.cif = nf.cif;
                if (nf.codigo_oficial) existing.codigo_oficial = nf.codigo_oficial;
                if (nf.direccion) existing.direccion = nf.direccion;
                if (nf.telefono) existing.telefono = nf.telefono;
                if (nf.email) existing.email = nf.email;
                if (nf.logistica !== undefined) existing.logistica = Boolean(nf.logistica);
                if (nf.informatica !== undefined) existing.informatica = Boolean(nf.informatica);
                if (nf.codigo_logistica) existing.codigo_logistica = nf.codigo_logistica;
                if (nf.codigo_informatica) existing.codigo_informatica = nf.codigo_informatica;
                if (nf.software) existing.software = normalizeSoftwareValue(nf.software);
                if (nf.distribuidor) existing.distribuidor = normalizeDistributorValue(nf.distribuidor);
                if (nf.agrupacion) existing.agrupacion = nf.agrupacion;
                if (Array.isArray(nf.auditorias) && nf.auditorias.length > 0) {
                    nf.auditorias.forEach(a => {
                        if (Array.isArray(a.puestos)) {
                            a.puestos.forEach(pt => {
                                if (pt.software) pt.software = normalizeSoftwareValue(pt.software);
                            });
                        }
                    });
                    existing.auditorias = nf.auditorias;
                }
            }
        } else {
            // Custom pharmacy outside official catalog
            nf.software = normalizeSoftwareValue(nf.software || "");
            nf.distribuidor = normalizeDistributorValue(nf.distribuidor || "");
            appState.pharmacies.push(nf);
        }
    }

    function mergeCorporateData(corpData) {
        if (!corpData || typeof corpData !== 'object') return;
        const entries = Array.isArray(corpData)
            ? corpData.map(item => [item.id, item])
            : Object.entries(corpData);

        entries.forEach(([id, data]) => {
            if (!data) return;
            const targetId = String((typeof data === 'object' && data.id) ? data.id : id).trim().toUpperCase();
            let p = appState.pharmacies.find(x => String(x.id).trim().toUpperCase() === targetId);
            if (!p && typeof data === 'object' && (data.codigo_colegial || data.codigo_oficial)) {
                const cCol = String(data.codigo_colegial || data.codigo_oficial).trim().toUpperCase();
                p = appState.pharmacies.find(x => String(x.codigo_colegial || x.codigo_oficial || x.id).trim().toUpperCase() === cCol);
            }
            if (!p && typeof data === 'object' && typeof data !== 'string') {
                p = { id: data.id || id };
                ensurePharmacyDefaults(p);
                appState.pharmacies.push(p);
            }
            if (p) {
                if (typeof data === 'string') {
                    if (data.trim() !== "") p.observaciones = data;
                    return;
                }
                if (data.nombre !== undefined && data.nombre !== "") p.nombre = data.nombre;
                if (data.titular !== undefined && data.titular !== "") p.titular = data.titular;
                if (data.cif !== undefined && data.cif !== "") p.cif = data.cif;
                if (data.codigo_oficial !== undefined && data.codigo_oficial !== "") p.codigo_oficial = data.codigo_oficial;
                if (data.direccion !== undefined && data.direccion !== "") p.direccion = data.direccion;
                if (data.localidad !== undefined && data.localidad !== "") p.localidad = data.localidad;
                if (data.zona !== undefined && data.zona !== "") p.zona = data.zona;
                if (data.lat !== undefined && data.lat !== null) p.lat = data.lat;
                if (data.lng !== undefined && data.lng !== null) p.lng = data.lng;
                if (data.telefono !== undefined && data.telefono !== "") p.telefono = data.telefono;
                if (data.email !== undefined && data.email !== "") p.email = data.email;
                if (data.logistica !== undefined) p.logistica = Boolean(data.logistica);
                if (data.informatica !== undefined) p.informatica = Boolean(data.informatica);
                if (data.codigo_logistica !== undefined && data.codigo_logistica !== "") p.codigo_logistica = data.codigo_logistica;
                if (data.codigo_informatica !== undefined && data.codigo_informatica !== "") p.codigo_informatica = data.codigo_informatica;
                if (data.software !== undefined && data.software !== "") p.software = normalizeSoftwareValue(data.software);
                if (data.distribuidor !== undefined && data.distribuidor !== "") p.distribuidor = normalizeDistributorValue(data.distribuidor);
                if (data.agrupacion !== undefined && data.agrupacion !== "") p.agrupacion = data.agrupacion;
                if (data.observaciones !== undefined && data.observaciones !== "") p.observaciones = data.observaciones;
                if (Array.isArray(data.auditorias) && data.auditorias.length > 0) {
                    data.auditorias.forEach(a => {
                        if (Array.isArray(a.puestos)) {
                            a.puestos.forEach(pt => {
                                if (pt.software) pt.software = normalizeSoftwareValue(pt.software);
                            });
                        }
                    });
                    p.auditorias = data.auditorias;
                }

                // Sync hefame_informatica label
                if (p.logistica && p.informatica) p.hefame_informatica = 'Ambos';
                else if (p.logistica) p.hefame_informatica = 'Cliente Logística';
                else if (p.informatica) p.hefame_informatica = 'Cliente Software';
                else p.hefame_informatica = '';
            }
        });
    }
    window.mergeCorporateData = mergeCorporateData;

    function initUnifiedMap() {
        const mapDiv = document.getElementById('unifiedMap');
        if (!mapDiv) return;

        if (mapInstance) {
            mapInstance.remove();
            mapInstance = null;
        }

        mapInstance = L.map('unifiedMap', {
            center: [42.695, -1.676],
            zoom: 10,
            zoomSnap: 0.05,
            zoomDelta: 0.22,
            wheelPxPerZoomLevel: 200,
            zoomControl: false,
            attributionControl: false,
            tap: false
        });

        // Elevate popupPane above floating filter bar (z-index 1200 vs 1000) while keeping map tiles below (z-index 400)
        const mapPaneEl = mapInstance.getPane('mapPane');
        const popupPaneEl = mapInstance.getPane('popupPane');
        if (mapPaneEl && popupPaneEl && popupPaneEl.parentNode === mapPaneEl) {
            mapInstance.getContainer().appendChild(popupPaneEl);
            const syncPopupPaneTransform = () => {
                popupPaneEl.style.transform = mapPaneEl.style.transform;
            };
            syncPopupPaneTransform();
            const paneObserver = new MutationObserver(syncPopupPaneTransform);
            paneObserver.observe(mapPaneEl, { attributes: true, attributeFilter: ['style'] });
            mapInstance.on('move zoom viewreset moveend zoomend', syncPopupPaneTransform);
        }

        L.control.zoom({ position: 'topright' }).addTo(mapInstance);

        const darkBase = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri',
            maxZoom: 16
        });
        const darkLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 16
        });
        tileLayers.dark = L.layerGroup([darkBase, darkLabels]);

        tileLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 19
        });

        currentTileLayer = tileLayers[currentMapLayerMode] || tileLayers.dark;
        currentTileLayer.addTo(mapInstance);

        markersCluster = L.markerClusterGroup({
            maxClusterRadius: 36,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true
        });
        mapInstance.addLayer(markersCluster);

        renderUnifiedMarkers();
        fitMapToVisibleMarkers();
    }

    function fitMapToVisibleMarkers() {
        if (!mapInstance) return;
        const pts = getFilteredMapPharmacies().filter(p => p.lat && p.lng).map(p => [p.lat, p.lng]);
        if (pts.length === 0) return;
        const bounds = L.latLngBounds(pts);
        const topBar = document.querySelector('.map-filter-floating-bar');
        const topPad = topBar ? (topBar.offsetHeight + 18) : 95;
        const bottomPad = 56;
        mapInstance.fitBounds(bounds, {
            paddingTopLeft: [18, topPad],
            paddingBottomRight: [18, bottomPad],
            maxZoom: 14,
            animate: false
        });
        mapInstance.setZoom(Math.min(mapInstance.getZoom() + 0.25, 14), { animate: false });
    }

    function toggleMapLayer() {
        if (!mapInstance) return;
        if (currentTileLayer) mapInstance.removeLayer(currentTileLayer);

        if (currentMapLayerMode === 'dark') {
            currentMapLayerMode = 'satellite';
        } else {
            currentMapLayerMode = 'dark';
        }

        currentTileLayer = tileLayers[currentMapLayerMode];
        if (currentTileLayer) currentTileLayer.addTo(mapInstance);

        const btn = document.getElementById('btnToggleLayer');
        if (btn) {
            btn.innerText = currentMapLayerMode === 'satellite' ? 'Mapa' : 'Satélite';
        }
    }

    function getFilteredMapPharmacies() {
        return appState.pharmacies.filter(p => {
            if (mapFilterLogistica && mapFilterInformatica) {
                if (!p.logistica && !p.informatica) return false;
            } else if (mapFilterLogistica) {
                if (!p.logistica) return false;
            } else if (mapFilterInformatica) {
                if (!p.informatica) return false;
            }

            if (mapFilterDistributor) {
                const pDist = normalizeDistributorValue(p.distribuidor || '').toLowerCase();
                if (pDist !== mapFilterDistributor.toLowerCase()) return false;
            }

            if (mapFilterSoftware) {
                const pSoft = normalizeSoftwareValue(p.software || '').toLowerCase();
                if (pSoft !== mapFilterSoftware.toLowerCase()) return false;
            }

            if (mapFilterVisit) {
                const latest = getLatestVisitInfo(p);
                if (mapFilterVisit === 'visited' && !latest) return false;
                if (mapFilterVisit === 'unvisited' && latest) return false;
                if (mapFilterVisit === 'gt1m' && (!latest || latest.daysAgo === null || latest.daysAgo <= 30)) return false;
                if (mapFilterVisit === 'gt3m' && (!latest || latest.daysAgo === null || latest.daysAgo <= 90)) return false;
                if (mapFilterVisit === 'gt6m' && (!latest || latest.daysAgo === null || latest.daysAgo <= 180)) return false;
                if (mapFilterVisit === 'gt1y' && (!latest || latest.daysAgo === null || latest.daysAgo <= 365)) return false;
            }

            return true;
        });
    }

    function createUnifiedMarkerIcon(p) {
        const hasLog = Boolean(p.logistica);
        const hasInf = Boolean(p.informatica);
        const isActive = hasLog || hasInf;
        const pinClass = 'map-marker-pin' + (isActive ? ' pin-active' : '');
        const latest = getLatestVisitInfo(p);
        let visitDotClass = '';
        if (latest) {
            if (latest.daysAgo !== null && latest.daysAgo > 365) visitDotClass = 'overdue';
            else if (latest.daysAgo !== null && latest.daysAgo > 90) visitDotClass = 'stale';
            else visitDotClass = 'recent';
        }
        const visitDotHtml = latest
            ? `<span class="pin-visit-dot ${visitDotClass}"></span>`
            : '';

        const innerHtml = `
            <div class="pin-inner" style="position: relative;">
                ${visitDotHtml}
                <span class="pin-sub ${hasLog ? 'active' : ''}">D</span>
                <span class="pin-div"></span>
                <span class="pin-sub ${hasInf ? 'active' : ''}">I</span>
            </div>
        `;

        return L.divIcon({
            className: pinClass,
            html: innerHtml,
            iconSize: [30, 30],
            iconAnchor: [15, 15],
            popupAnchor: [0, -15]
        });
    }

    function renderUnifiedMarkers() {
        if (!markersCluster || !mapInstance) return;
        markersCluster.clearLayers();
        markersMap = {};

        const filtered = getFilteredMapPharmacies();
        filtered.forEach(p => {
            if (!p.lat || !p.lng) return;
            const marker = L.marker([p.lat, p.lng], { icon: createUnifiedMarkerIcon(p) });
            marker.bindPopup(() => createUnifiedPopupContent(p.id), { autoPan: false });
            marker.on('click', () => {
                selectPharmacyOnMap(p.id, true);
            });
            markersCluster.addLayer(marker);
            markersMap[p.id] = marker;
        });
    }

    function createUnifiedPopupContent(id) {
        const p = appState.pharmacies.find(x => String(x.id) === String(id));
        if (!p) return '';

        const logActive = Boolean(p.logistica);
        const infActive = Boolean(p.informatica);

        const logStyle = logActive 
            ? "background: var(--card-focus-bg); border: 1px solid var(--border-focus); color: #ffffff; font-weight: 700;" 
            : "background: var(--input-bg); border: 1px solid var(--border); color: var(--text-muted); font-weight: 500;";

        const infStyle = infActive 
            ? "background: var(--card-focus-bg); border: 1px solid var(--border-focus); color: #ffffff; font-weight: 700;" 
            : "background: var(--input-bg); border: 1px solid var(--border); color: var(--text-muted); font-weight: 500;";

        const latest = getLatestVisitInfo(p);
        const visitSummaryHtml = latest
            ? `<div style="font-size: 0.78rem; color: var(--text-main); margin-bottom: 10px; font-weight: 600;">Última visita: ${latest.fecha}${latest.hora ? ` ${latest.hora}` : ''}${latest.daysAgo !== null ? ` (${latest.daysAgo === 0 ? 'hoy' : `hace ${latest.daysAgo}d`})` : ''} &bull; ${latest.count} total</div>`
            : `<div style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 10px;">Sin visitas registradas</div>`;

        const zoneSuffix = p.zona && p.zona !== p.localidad ? ` (${p.zona})` : '';

        return `
            <div style="font-family: var(--font-main); min-width: 230px;">
                <div style="font-weight: 700; font-size: 0.85rem; color: var(--text-main); margin-bottom: 4px; line-height: 1.3;">${p.nombre}</div>
                <div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 8px;">${p.codigo_cliente ? `${p.codigo_cliente} &bull; ` : ""}${p.localidad}${zoneSuffix}</div>
                ${visitSummaryHtml}
                
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <div style="flex: 1; text-align: center; padding: 6px 4px; border-radius: var(--radius); font-size: 0.82rem; user-select: none; ${logStyle}">
                        Distribución
                    </div>
                    <div style="flex: 1; text-align: center; padding: 6px 4px; border-radius: var(--radius); font-size: 0.82rem; user-select: none; ${infStyle}">
                        Informática
                    </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px;">
                    <button type="button" class="btn-light" onclick="openPharmacyFromMap('${p.id}')" style="width: 100%; height: 34px; font-size: 0.82rem;">
                        Abrir Ficha
                    </button>
                    <a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" class="btn-dark" style="display: flex; align-items: center; justify-content: center; text-decoration: none; width: 100%; height: 34px; font-size: 0.82rem; border-radius: var(--radius); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #ffffff !important;">
                        Google Maps
                    </a>
                </div>
            </div>
        `;
    }

    function selectPharmacyOnMap(id, flyTo = true) {
        appState.selectedPharmacyId = String(id);
        updateTopBarPharmacySelect();

        const p = appState.pharmacies.find(x => String(x.id) === String(id));
        if (p && flyTo && mapInstance && p.lat && p.lng) {
            const targetZoom = Math.max(mapInstance.getZoom(), 16);
            mapInstance.flyTo([p.lat, p.lng], targetZoom, { duration: 0.5 });
            mapInstance.once('moveend', () => {
                const marker = markersMap[id];
                if (marker) {
                    markersCluster.zoomToShowLayer(marker, () => {
                        marker.openPopup();
                    });
                }
            });
        }
    }

    function openPharmacyFromMap(id) {
        appState.selectedPharmacyId = String(id);
        switchMainTab('details');
    }

    function viewPharmacyOnMap(id) {
        if (mapFilterLogistica || mapFilterInformatica || mapFilterDistributor || mapFilterSoftware || mapFilterVisit) {
            mapFilterLogistica = false;
            mapFilterInformatica = false;
            mapFilterDistributor = '';
            mapFilterSoftware = '';
            mapFilterVisit = '';
        }
        switchMainTab('map');
        setTimeout(() => {
            selectPharmacyOnMap(id, true);
        }, 100);
    }

    function updateMapCounters() {
        let cntLog = 0;
        let cntInf = 0;
        appState.pharmacies.forEach(p => {
            if (p.logistica) cntLog++;
            if (p.informatica) cntInf++;
        });
        const elTotal = document.getElementById('mapCntTotal');
        const elLog = document.getElementById('mapCntLog');
        const elInf = document.getElementById('mapCntInf');
        if (elTotal) elTotal.innerText = appState.pharmacies.length;
        if (elLog) elLog.innerText = cntLog;
        if (elInf) elInf.innerText = cntInf;
    }

    function toggleMapLogistica() {
        mapFilterLogistica = !mapFilterLogistica;
        const chip = document.getElementById('mapChipLog');
        if (chip) chip.classList.toggle('active', mapFilterLogistica);
        updateMapAllChip();
        renderUnifiedMarkers();
    }

    function toggleMapInformatica() {
        mapFilterInformatica = !mapFilterInformatica;
        const chip = document.getElementById('mapChipInf');
        if (chip) chip.classList.toggle('active', mapFilterInformatica);
        updateMapAllChip();
        renderUnifiedMarkers();
    }

            btnInfo.title = url ? `Abrir web oficial de ${mapFilterDistributor}` : 'Selecciona un distribuidor con web oficial';
        }

        renderUnifiedMarkers();
    }

    function handleMapSoftwareFilter(val) {
        mapFilterSoftware = val || '';
        const btnInfo = document.getElementById('btnMapInfoSoftware');
        if (btnInfo) {
            const url = getCatalogUrl(SOFTWARE_CATALOG, mapFilterSoftware);
            btnInfo.disabled = !url;
            btnInfo.title = url ? `Abrir web oficial de ${mapFilterSoftware}` : 'Selecciona un software con web oficial';
        }
        updateMapAllChip();
        renderUnifiedMarkers();
    }

    function resetMapFilters() {
        mapFilterLogistica = false;
        mapFilterInformatica = false;
        mapFilterDistributor = '';
        mapFilterSoftware = '';
        mapFilterVisit = '';
        const selDist = document.getElementById('mapSelectDistributor');
        if (selDist) selDist.value = '';
        const selSoft = document.getElementById('mapSelectSoftware');
        if (selSoft) selSoft.value = '';
        const selVisit = document.getElementById('mapSelectVisit');
        if (selVisit) selVisit.value = '';
        const btnInfoDist = document.getElementById('btnMapInfoDistributor');
        if (btnInfoDist) btnInfoDist.disabled = true;
        const btnInfoSoft = document.getElementById('btnMapInfoSoftware');
        if (btnInfoSoft) btnInfoSoft.disabled = true;
        updateMapAllChip();
        renderUnifiedMarkers();
    }

    function updateMapAllChip() {
        const chipAll = document.getElementById('mapChipAll');
        const chipLog = document.getElementById('mapChipLog');
        const chipInf = document.getElementById('mapChipInf');
        const isAll = !mapFilterLogistica && !mapFilterInformatica && !mapFilterDistributor && !mapFilterSoftware && !mapFilterVisit;
        if (chipAll) chipAll.classList.toggle('active', isAll);
        if (chipLog) chipLog.classList.toggle('active', mapFilterLogistica);
        if (chipInf) chipInf.classList.toggle('active', mapFilterInformatica);
    }

    function updateNavTabsState() {
        const tabDetails = document.getElementById('tabMainDetails');
        const tabTimeline = document.getElementById('tabMainTimeline');

        const hasActivePharmacy = getActivePharmacy() !== null;
        let totalVisits = 0;
        appState.pharmacies.forEach(f => {
            if (Array.isArray(f.visitas)) totalVisits += f.visitas.length;
        });

        if (tabDetails) {
            tabDetails.disabled = !hasActivePharmacy;
        }
        if (tabTimeline) {
            tabTimeline.disabled = totalVisits === 0;
        }

        if (appState.mainTab === 'details' && !hasActivePharmacy) {
            appState.mainTab = 'map';
            const tabMap = document.getElementById('tabMainMap');
            if (tabMap) tabMap.classList.add('active');
            if (tabDetails) tabDetails.classList.remove('active');
        } else if (appState.mainTab === 'timeline' && totalVisits === 0) {
            appState.mainTab = 'map';
            const tabMap = document.getElementById('tabMainMap');
            if (tabMap) tabMap.classList.add('active');
            if (tabTimeline) tabTimeline.classList.remove('active');
        }
    }

    function renderWorkspace() {
        updateTopBarPharmacySelect();
        updateNavTabsState();
        const area = document.getElementById('workspaceArea');
        area.innerHTML = '';

        if (appState.mainTab === 'map') {
            renderMapWorkspace(area);
        } else if (appState.mainTab === 'details') {
            renderPharmacyDetails(area);
        } else {
            renderGlobalTimeline(area);
        }
    }

    async function createNewPharmacy() {
        if (!appState.adminUnlocked) {
            const pass = prompt("Introduce la clave para editar datos maestros:");
            if (pass === null) return;
            if (!(await verifyHash(pass, H_ADMIN))) {
                alert("Clave incorrecta.");
                return;
            }
            appState.adminUnlocked = true;
            renderWorkspace();
        }
        const newPharmacy = {
            id: 'F' + String(Date.now()).slice(-5),
            nombre: "Nueva Farmacia",
            titular: "",
            cif: "",
            codigo_logistica: "",
            codigo_informatica: "",
            codigo_cliente: "",
            hefame_informatica: "",
            direccion: "",

                    [1,11,1],[5,12,1],
                    [0,13,1],[13,14,1],[14,15,2],[15,16,1],[16,17,1],[17,18,1],[18,13,1],
                    [15,19,1],[18,20,1],[20,21,2],[20,22,1]
                ]
            }
        ];

        // Track pointer position over the footer action bar
        let mouse = { x: -9999, y: -9999, inside: false };
        banner.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.inside = true;
        });
        banner.addEventListener('mouseleave', () => {
            mouse.inside = false;
            mouse.x = -9999;
            mouse.y = -9999;
        });

        // Harmonic horizontal distribution in the left free area of the footer (spread on mobile)
        const anchors = width > 600 ? [0.08, 0.20, 0.32, 0.44] : [0.12, 0.36, 0.64, 0.88];
        let floatingMolecules = REAL_MOLECULES.map((mol, idx) => ({
            ...mol,
            anchorRatio: anchors[idx],
            x: width * anchors[idx],
            y: height * 0.5 + (idx % 2 === 0 ? -3 : 3),
            vx: (Math.random() - 0.5) * 0.16,
            vy: (Math.random() - 0.5) * 0.12,
            rx: (Math.random() - 0.5) * 0.5,
            ry: (Math.random() - 0.5) * 0.5,
            rz: (Math.random() - 0.5) * 0.4,
            vrx: (Math.random() - 0.5) * 0.0008,
            vry: (Math.random() - 0.5) * 0.0008,
            vrz: (Math.random() - 0.5) * 0.0006,
            phase: idx * 1.7,
            hover: 0
        }));

        // 3D projection with 3-axis Euler rotation (X, Y, Z) and perspective
        function projectPoint(pt, rx, ry, rz, scale) {
            let x = pt.x * scale;
            let y = pt.y * scale;
            let z = (pt.z || 0) * scale;

            // Rotation X
            let cosX = Math.cos(rx), sinX = Math.sin(rx);
            let y1 = y * cosX - z * sinX;
            let z1 = y * sinX + z * cosX;

            // Rotation Y
            let cosY = Math.cos(ry), sinY = Math.sin(ry);
            let x2 = x * cosY + z1 * sinY;
            let z2 = -x * sinY + z1 * cosY;

            // Rotation Z
            let cosZ = Math.cos(rz), sinZ = Math.sin(rz);
            let x3 = x2 * cosZ - y1 * sinZ;
            let y3 = x2 * sinZ + y1 * cosZ;

            const fov = 220;
            const persp = fov / (fov + z2 + 40);
            return { x: x3 * persp, y: y3 * persp, z: z2, p: persp, t: pt.t };
        }

        let time = 0;
        let lastFrameTs = 0;
        let isCanvasVisible = true;

        if ('IntersectionObserver' in window) {
            const io = new IntersectionObserver((entries) => {
                const wasVisible = isCanvasVisible;
                isCanvasVisible = entries[0] ? entries[0].isIntersecting : true;
                if (isCanvasVisible && !wasVisible && !document.hidden) {
                    lastFrameTs = performance.now();
                    headerAnimId = requestAnimationFrame(loop);
                }
            });
            io.observe(canvas);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isCanvasVisible) {
                lastFrameTs = performance.now();
                if (headerAnimId) cancelAnimationFrame(headerAnimId);
                headerAnimId = requestAnimationFrame(loop);
            }
        });

        function loop(now = performance.now()) {
            if (document.hidden || !isCanvasVisible) {
                headerAnimId = null;
                return;
            }

            const anyHover = mouse.inside || floatingMolecules.some(m => m.hover > 0.01);
            const minInterval = anyHover ? 16 : 55; // 60fps on hover, ~18fps idle
            const elapsed = lastFrameTs ? (now - lastFrameTs) : minInterval;
            if (elapsed < minInterval) {
                headerAnimId = requestAnimationFrame(loop);
                return;
            }
            const dtMult = Math.min(3.5, Math.max(1, elapsed / 16.67));
            lastFrameTs = now;

            time += 0.008 * dtMult;
            ctx.clearRect(0, 0, width, height);

            // Detect closest molecule to the pointer
            let closestIdx = -1;
            let minDist = 85;
            if (mouse.inside) {
                floatingMolecules.forEach((mol, idx) => {
                    const d = Math.hypot(mol.x - mouse.x, mol.y - mouse.y);
                    if (d < minDist) {
                        minDist = d;
                        closestIdx = idx;
                    }
                });
            }

            floatingMolecules.forEach((mol, idx) => {
                const isTarget = (idx === closestIdx);
                mol.hover += ((isTarget ? 1 : 0) - mol.hover) * Math.min(1, 0.12 * dtMult);

                // Stop completely on hover (speedMult -> 0), otherwise drift smoothly
                const speedMult = Math.max(0, 1 - mol.hover * 1.15) * dtMult;
                mol.x += mol.vx * speedMult;
                mol.y += mol.vy * speedMult;

                const maxX = width > 600 ? width * 0.50 : width - 36;
                if (mol.x < 36) { mol.x = 36; mol.vx *= -1; }
                if (mol.x > maxX) { mol.x = maxX; mol.vx *= -1; }
                if (mol.y < 14) { mol.y = 14; mol.vy *= -1; }
                if (mol.y > height - 14) { mol.y = height - 14; mol.vy *= -1; }

                if (isTarget) {
                    // Align to the nearest front-facing plane (nearest multiple of PI) without spinning
                    const bestRx = Math.round(mol.rx / Math.PI) * Math.PI + 0.12;
                    const bestRy = Math.round(mol.ry / Math.PI) * Math.PI - 0.12;
                    const bestRz = Math.round(mol.rz / Math.PI) * Math.PI;
                    mol.rx += (bestRx - mol.rx) * 0.14;
                    mol.ry += (bestRy - mol.ry) * 0.14;
                    mol.rz += (bestRz - mol.rz) * 0.12;
                } else {
                    mol.rx += mol.vrx * speedMult;
                    mol.ry += mol.vry * speedMult;
                    mol.rz += mol.vrz * speedMult;
                }

                const currentScale = mol.scale * (1 + mol.hover * 0.22);
                const projected = mol.points.map(pt => projectPoint(pt, mol.rx, mol.ry, mol.rz, currentScale));

                ctx.save();
                ctx.translate(mol.x, mol.y);

                // 10% resting opacity (0.10), scaling up to 100% (1.00) on pointer hover
                const baseAlpha = 0.10 + mol.hover * 0.90;

                // Sort covalent bonds by Z-depth (painter's algorithm) for 3D occlusion
                const sortedBonds = mol.bonds.map(([i1, i2, order], bIdx) => ({
                    p1: projected[i1],
                    p2: projected[i2],
                    order: order || 1,
                    bIdx,
                    z: (projected[i1].z + projected[i2].z) * 0.5
                })).sort((a, b) => a.z - b.z);

                // Render single/double covalent bonds + hover electron resonance pulse
                sortedBonds.forEach(b => {
                    const depthFactor = Math.max(0.70, Math.min(1.0, 1 - b.z / 55));
                    const bondAlpha = Math.min(1, baseAlpha * (0.55 + mol.hover * 0.45) * depthFactor);

                    ctx.strokeStyle = 'rgba(165, 165, 170, ' + bondAlpha.toFixed(3) + ')';
                    ctx.lineWidth = (1.1 + mol.hover * 0.35) * depthFactor;

                    const dx = b.p2.x - b.p1.x;
                    const dy = b.p2.y - b.p1.y;
                    const len = Math.hypot(dx, dy) || 1;
                    const nx = -dy / len;
                    const ny = dx / len;

                    if (b.order === 2) {
                        const offset = 1.35 * depthFactor;
                        ctx.beginPath();
                        ctx.moveTo(b.p1.x + nx * offset, b.p1.y + ny * offset);
                        ctx.lineTo(b.p2.x + nx * offset, b.p2.y + ny * offset);
                        ctx.moveTo(b.p1.x - nx * offset * 0.7, b.p1.y - ny * offset * 0.7);
                        ctx.lineTo(b.p2.x - nx * offset * 0.7, b.p2.y - ny * offset * 0.7);
                        ctx.stroke();
                    } else {
                        ctx.beginPath();
                        ctx.moveTo(b.p1.x, b.p1.y);
                        ctx.lineTo(b.p2.x, b.p2.y);
                        ctx.stroke();
                    }

                    // Artistic pulse representing shared/delocalized electron density on hover
                    const pulseWave = Math.sin(time * 2.4 - b.bIdx * 0.55 + mol.phase);
                    if (mol.hover > 0.05 && pulseWave > 0.75) {
                        const t = (pulseWave - 0.75) / 0.25;
                        const px = b.p1.x + dx * t;
                        const py = b.p1.y + dy * t;
                        ctx.beginPath();
                        ctx.arc(px, py, 1.3 + mol.hover * 0.5, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.65 * mol.hover).toFixed(3) + ')';
                        ctx.fill();
                    }
                });

                // Sort heavy atoms by Z-depth and color by CPK convention (O=red, N=blue, C=light gray)
                const sortedAtoms = projected.slice().sort((a, b) => a.z - b.z);
                sortedAtoms.forEach(p => {
                    const depthFactor = Math.max(0.75, Math.min(1.0, 1 - p.z / 55));
                    const r = (p.t === 'C' ? 1.85 : 2.65) * depthFactor * (1 + mol.hover * 0.15);

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
                    if (p.t === 'O') {
                        ctx.fillStyle = '#f66151';
                    } else if (p.t === 'N') {
                        ctx.fillStyle = '#7dd3fc';
                    } else {
                        ctx.fillStyle = '#f4f4f5';
                    }
                    ctx.globalAlpha = Math.min(1, baseAlpha * depthFactor);
                    ctx.fill();
                });

                ctx.restore();

                // Subtle molecule formula and name label at 20% opacity on hover
                if (mol.hover > 0.04) {
                    ctx.save();
                    ctx.globalAlpha = 0.20 * mol.hover;

                    const labelText = mol.formula + ' · ' + mol.name;
                    ctx.font = '700 9.5px Ubuntu, monospace';
                    const textW = ctx.measureText(labelText).width;

                    const placeRight = mol.x < width * 0.5;
                    let textX = placeRight ? (mol.x + 22) : (mol.x - 22 - textW);
                    textX = Math.max(8, Math.min(width - textW - 8, textX));
                    const textY = Math.max(12, Math.min(height - 12, mol.y));

                    ctx.fillStyle = '#fcfcfc';
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(labelText, textX, textY);
                    ctx.restore();
                }
            });

            headerAnimId = requestAnimationFrame(loop);
        }
        loop();
    }

    function changeAuditVersion(indexStr) {
        const p = getActivePharmacy();
        if (p) {
            p.selectedAuditIndex = parseInt(indexStr);
            renderWorkspace();
        }
    }

    function updateAuditDate(newDate) {
        const p = getActivePharmacy();
        if (p) {
            const audit = getActiveAudit(p);
            if (audit) {
                audit.fecha = newDate;
                const selector = document.getElementById('auditVersionSelector');
                if (selector && selector.options[p.selectedAuditIndex]) {
                    selector.options[p.selectedAuditIndex].text = newDate || 'Sin fecha';
                }
            }
        }
    }

    function openNewAuditModal(pharmacyId) {
        const p = appState.pharmacies.find(x => String(x.id) === String(pharmacyId));
        if (!p) return;

        if (!isPharmacyAudited(p)) {
            createNewAuditVersion(pharmacyId, null, 'blank');
            return;
        }

        const modalId = 'modalNewAudit_' + Date.now();

        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal-overlay';
        modalDiv.id = modalId;
        modalDiv.innerHTML = `
            <div class="modal-content">
                <div class="section-title" style="margin-bottom: 14px;"><span>Crear Nueva Revisión</span></div>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 16px;">Selecciona cómo deseas inicializar la nueva revisión de auditoría:</p>
                
                <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
                    <button type="button" class="btn-light" style="padding: 12px; text-align: left; text-transform: none; font-weight: 500; font-size: 0.85rem;" onclick="createNewAuditVersion('${pharmacyId}', '${modalId}', 'clone')">
                        <strong style="display: block; font-weight: 700; margin-bottom: 2px;">Copiar equipamiento actual</strong>
                    </button>

                    <button type="button" class="btn-dark" style="padding: 12px; text-align: left; text-transform: none; font-weight: 500; font-size: 0.85rem;" onclick="createNewAuditVersion('${pharmacyId}', '${modalId}', 'blank')">
                        <strong style="display: block; font-weight: 700; margin-bottom: 2px;">Auditoría en blanco</strong>
                    </button>
                </div>

                <div style="display: flex; justify-content: flex-end;">
                    <button type="button" class="btn-dark" onclick="document.getElementById('${modalId}').remove()">Cancelar</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
    }

    function createNewAuditVersion(pharmacyId, modalId, mode) {
        const p = appState.pharmacies.find(x => x.id === pharmacyId);
        if (!p) return;

        ensureAuditStructure(p);
        const currentAudit = getActiveAudit(p);

        let newAudit = createBlankAuditObject();

        if (mode === 'clone' && currentAudit) {
            newAudit.configuracion = JSON.parse(JSON.stringify(currentAudit.configuracion || {}));
            newAudit.opcionalesChecks = JSON.parse(JSON.stringify(currentAudit.opcionalesChecks || {}));
            newAudit.puestos = JSON.parse(JSON.stringify(currentAudit.puestos || []));
            newAudit.router_farmacia = currentAudit.router_farmacia || "";
            newAudit.router_privado = currentAudit.router_privado || "";
            newAudit.imp_documentos = JSON.parse(JSON.stringify(currentAudit.imp_documentos || [""]));
            newAudit.imp_tickets = JSON.parse(JSON.stringify(currentAudit.imp_tickets || [""]));
            newAudit.opt_robot = currentAudit.opt_robot || "";
            newAudit.opt_cajon = currentAudit.opt_cajon || "";
            newAudit.opt_verificador = currentAudit.opt_verificador || "";
            newAudit.opt_visor = currentAudit.opt_visor || "";
            newAudit.opt_pda = currentAudit.opt_pda || "";
            newAudit.opt_turnos = currentAudit.opt_turnos || "";
            newAudit.opt_backup = currentAudit.opt_backup || "";
        }

        p.auditorias.push(newAudit);
        p.selectedAuditIndex = p.auditorias.length - 1;

        if (modalId) {
            const modalEl = document.getElementById(modalId);
            if (modalEl) modalEl.remove();
        }
        renderWorkspace();
    }

    function deleteCurrentAuditVersion(pharmacyId) {
        const p = appState.pharmacies.find(x => x.id === pharmacyId);
        if (!p || !p.auditorias || p.auditorias.length === 0) return;

        if (p.auditorias.length > 1) {
            if (!confirm('¿Eliminar esta revisión de auditoría?')) return;
            p.auditorias.splice(p.selectedAuditIndex, 1);
            if (p.selectedAuditIndex >= p.auditorias.length) {
                p.selectedAuditIndex = p.auditorias.length - 1;
            }
        } else {
            if (!confirm('¿Eliminar la auditoría de esta farmacia y dejarla sin equipamiento configurado?')) return;
            p.auditorias = [createBlankAuditObject("")];
            p.selectedAuditIndex = 0;
            p.configuracion = { puestosSelector: "", checkSAI: false, numImpDoc: 1, numImpTicket: 1 };
            p.puestos = [];
        }
        markUnsavedChanges();
        renderWorkspace();
    }

    function updateActiveAuditField(field, value) {
        const p = getActivePharmacy();
        if (p) {
            const audit = getActiveAudit(p);
            if (audit) {
                audit[field] = value;
                markUnsavedChanges();
            }
        }
    }

    function updatePharmacyField(id, field, value) {
        const p = appState.pharmacies.find(x => String(x.id) === String(id));
        if (p) {
            p[field] = value;
            markUnsavedChanges();
            if (field === 'nombre') {
                p.titular = value;
            }
            if (field === 'software') {
                const btnInfo = document.getElementById('btnFichaInfoSoftware');
                if (btnInfo) {
                    const url = getCatalogUrl(SOFTWARE_CATALOG, value);
                    btnInfo.disabled = !url;
                    btnInfo.title = url ? `Abrir web oficial de ${value}` : 'Selecciona un software con web oficial';
                }
                const audit = getActiveAudit(p);
                if (audit && audit.puestos && Array.isArray(audit.puestos)) {
                    audit.puestos.forEach(puesto => {
                        puesto.software = value;
                    });
                    document.querySelectorAll('.puesto-software').forEach(input => {
                        input.value = value;
                    });
                }
            }
            if (field === 'distribuidor') {
                const btnInfo = document.getElementById('btnFichaInfoDistributor');
                if (btnInfo) {
                    const url = getCatalogUrl(DISTRIBUTORS_CATALOG, value);
                    btnInfo.disabled = !url;
                    btnInfo.title = url ? `Abrir web oficial de ${value}` : 'Selecciona un distribuidor con web oficial';
                }
            }
            updateTopBarPharmacySelect();
        }
    }

    function updateAuditUI() {
        const selector = document.getElementById('puestosSelector');
        const container = document.getElementById('puestosContainer');
        const option = selector.value;
        const p = getActivePharmacy();
        if (!p) return;

        const audit = getActiveAudit(p);
        if (!audit) return;

        audit.configuracion.puestosSelector = option;
        
        // If selecting a valid structure and audit had no date yet, assign today
        if (option) {
            if (!audit.fecha) {
                audit.fecha = new Date().toISOString().split('T')[0];
            }
            const dateField = document.getElementById('auditDateField');
            if (dateField) {
                dateField.value = audit.fecha;
                dateField.removeAttribute('readonly');
                dateField.className = 'field-editable';
            }
            const verSelector = document.getElementById('auditVersionSelector');
            if (verSelector) {
                verSelector.removeAttribute('disabled');
                if (verSelector.options[p.selectedAuditIndex]) {
                    verSelector.options[p.selectedAuditIndex].text = audit.fecha;
                }
            }
            const btnAdd = document.getElementById('btnAddAuditVersion');
            if (btnAdd && appState.adminUnlocked) {
                btnAdd.removeAttribute('disabled');
                btnAdd.setAttribute('title', 'Crear nueva versión de auditoría');
                btnAdd.onclick = () => openNewAuditModal(p.id);

            const btnDelete = document.getElementById('btnDeleteAuditVersion');
            if (btnDelete) {
                btnDelete.style.display = appState.adminUnlocked ? 'flex' : 'none';
            }

        container.innerHTML = '';
        if (!option) {
            if (!p.auditorias || p.auditorias.length <= 1) {
                p.auditorias = [createBlankAuditObject("")];
                p.selectedAuditIndex = 0;
                p.configuracion = { puestosSelector: "", checkSAI: false, numImpDoc: 1, numImpTicket: 1 };
                p.puestos = [];
            } else {
                audit.puestos = [];
            }
            updateTopBarPharmacySelect();
            renderWorkspace();

        let workstationConfigs = [];

            workstationConfigs.push({ title: 'Servidor - Monopuesto', index: 0 });
        } else {
            const secondaryCount = parseInt(option.split('-')[1]);
            workstationConfigs.push({ title: 'Servidor', index: 0 });
            for (let i = 1; i <= secondaryCount; i++) {
                workstationConfigs.push({ title: `Puesto ${i}`, index: i });

                }
