            let wsLockAttr = isAdminUnlocked ? "" : "readonly";
            let wsLockDisabled = isAdminUnlocked ? "" : "disabled";
            let wsLockClass = isAdminUnlocked ? "field-editable" : "field-locked";

            let copyToolbar = isAdminUnlocked ? `
                <div class="copy-toolbar">
                    <select id="copyFrom_${idx}" class="workstation-action-btn">
                        ${copyOptionsHTML}
                    </select>
                    <button type="button" class="workstation-action-btn" onclick="copyWorkstationConfig(${idx})">Copiar</button>
                </div>
            ` : '';

            const wsData = audit.puestos[idx] || {};

            box.innerHTML = `
                <div class="section-title" style="flex-direction: column; align-items: stretch; gap: 4px;">
                    <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                        <div class="section-title-header">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line></svg>
                            <span>${ws.title}</span>
                        </div>
                        <div class="workstation-controls-container">
                            <button type="button" class="workstation-action-btn" onclick="toggleWorkstation(this)">Expandir ▼</button>
                        </div>
                    </div>
                    ${copyToolbar}
                </div>
                
                <div class="workstation-body">
                    <div style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; border-bottom: 1px dashed var(--border); padding-bottom: 6px;">Hardware</div>
                    <div class="grid-2" style="margin-bottom: 14px;">
                        <div class="field-group"><label>Procesador (CPU)</label><input type="text" ${wsLockAttr} class="puesto-cpu ${wsLockClass}" value="${wsData.cpu || ''}" oninput="updateWorkstationState(${idx}, 'cpu', this.value)"></div>
                        <div class="field-group"><label>Memoria RAM</label><select ${wsLockDisabled} class="puesto-ram ${wsLockClass}" onchange="updateWorkstationState(${idx}, 'ram', this.value)">${generateSelectOptions(ramOptions, wsData.ram)}</select></div>
                        
                        <div class="field-group">
                            <label>Almacenamiento (Disco)</label>
                            <div class="grid-subgrid-2">
                                <select ${wsLockDisabled} class="puesto-disco-cap ${wsLockClass}" onchange="updateWorkstationState(${idx}, 'disco_cap', this.value)">${generateSelectOptions(diskCapacityOptions, wsData.disco_cap)}</select>
                                <select ${wsLockDisabled} class="puesto-disco-tipo ${wsLockClass}" onchange="updateWorkstationState(${idx}, 'disco_tipo', this.value)">${generateSelectOptions(diskTypeOptions, wsData.disco_tipo)}</select>
                            </div>

                        <div class="field-group"><label>Tarjeta de red</label><select ${wsLockDisabled} class="puesto-nic ${wsLockClass}" onchange="updateWorkstationState(${idx}, 'nic', this.value)">${generateSelectOptions(nicOptions, wsData.nic)}</select></div>
                        <div class="field-group"><label>Monitor / Pantalla</label><input type="text" ${wsLockAttr} class="puesto-monitor ${wsLockClass}" value="${wsData.monitor || ''}" oninput="updateWorkstationState(${idx}, 'monitor', this.value)"></div>
                        <div class="field-group"><label>Escáner / Lector de código de barras</label><input type="text" ${wsLockAttr} class="puesto-escaner ${wsLockClass}" value="${wsData.escaner || ''}" oninput="updateWorkstationState(${idx}, 'escaner', this.value)"></div>

                    <div style="font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; border-bottom: 1px dashed var(--border); padding-bottom: 6px;">Software</div>
                    <div class="grid-2">

                            <label>Software</label>
                            <select ${wsLockDisabled} class="puesto-software ${wsLockClass}" onchange="updateWorkstationState(${idx}, 'software', this.value)">

                        <div class="field-group"><label>Antivirus / Licencia</label><input type="text" ${wsLockAttr} class="puesto-antivirus ${wsLockClass}" value="${wsData.antivirus || ''}" oninput="updateWorkstationState(${idx}, 'antivirus', this.value)"></div>
                        <div class="field-group"><label>Observaciones</label><input type="text" ${wsLockAttr} class="puesto-obs ${wsLockClass}" value="${wsData.observaciones || ''}" oninput="updateWorkstationState(${idx}, 'observaciones', this.value)"></div>

                </div>
            `;
            container.appendChild(box);
        });

        toggleOptionalFields();
        updateTopBarPharmacySelect();
    }

    function toggleWorkstation(btn) {
        const box = btn.closest('.workstation-box');
        box.classList.toggle('expanded');
        btn.innerText = box.classList.contains('expanded') ? 'Colapsar ▲' : 'Expandir ▼';
    }

    function updateWorkstationState(idx, field, value) {
        const p = getActivePharmacy();
        if (p) {
            const audit = getActiveAudit(p);
            if (audit && audit.puestos[idx]) {
                audit.puestos[idx][field] = value;
                markUnsavedChanges();
            }
        }
    }

    function copyWorkstationConfig(targetIndex) {
        const selectSource = document.getElementById(`copyFrom_${targetIndex}`);
        if (!selectSource || selectSource.value === "") return;

        const sourceIdx = parseInt(selectSource.value);
        const p = getActivePharmacy();
        if (p) {
            const audit = getActiveAudit(p);
            if (audit && audit.puestos[sourceIdx]) {
                audit.puestos[targetIndex] = JSON.parse(JSON.stringify(audit.puestos[sourceIdx]));
                markUnsavedChanges();
                updateAuditUI();
            }
        }
    }

    function toggleOptionalFields() {
        const p = getActivePharmacy();
        if (!p) return;
        const audit = getActiveAudit(p);
        if (!audit) return;

        const checkSAIVal = document.getElementById('checkSAI').checked;
        audit.configuracion.checkSAI = checkSAIVal;
        
        document.querySelectorAll('.sai-puesto-field').forEach(field => {
            field.style.display = checkSAIVal ? 'flex' : 'none';
        });

        optionalFieldMappings.forEach(item => {
            const chk = document.getElementById(item.check);
            const target = document.getElementById(item.target);
            if (chk && target) {
                audit.opcionalesChecks[item.check] = chk.checked;
                target.style.display = chk.checked ? 'flex' : 'none';
            }
        });
    }

    function updatePrintersUI() {
        const p = getActivePharmacy();
        if (!p) return;
        const audit = getActiveAudit(p);
        if (!audit) return;

        const container = document.getElementById('printersContainer');
        const numDoc = parseInt(document.getElementById('numImpDoc').value) || 1;
        const numTicket = parseInt(document.getElementById('numImpTicket').value) || 1;

        audit.configuracion.numImpDoc = numDoc;
        audit.configuracion.numImpTicket = numTicket;

        while (audit.imp_documentos.length < numDoc) audit.imp_documentos.push("");
        while (audit.imp_tickets.length < numTicket) audit.imp_tickets.push("");

        container.innerHTML = '';

        const isAdminUnlocked = appState.adminUnlocked || false;
        const pLockAttr = isAdminUnlocked ? "" : "readonly";
        const pLockClass = isAdminUnlocked ? "field-editable" : "field-locked";

        for (let i = 0; i < numDoc; i++) {
            const val = audit.imp_documentos[i] || '';
            const div = document.createElement('div');
            div.className = 'field-group';
            div.innerHTML = `<label>Impresora Documentos / A4 (${i + 1})</label><input type="text" ${pLockAttr} class="${pLockClass}" value="${val}" oninput="let activeP = getActivePharmacy(); if(activeP) { let a = getActiveAudit(activeP); if(a) a.imp_documentos[${i}] = this.value; }">`;
            container.appendChild(div);
        }

        for (let i = 0; i < numTicket; i++) {
            const val = audit.imp_tickets[i] || '';
            const div = document.createElement('div');
            div.className = 'field-group';
            div.innerHTML = `<label>Impresora de Tickets (${i + 1})</label><input type="text" ${pLockAttr} class="${pLockClass}" value="${val}" oninput="let activeP = getActivePharmacy(); if(activeP) { let a = getActiveAudit(activeP); if(a) a.imp_tickets[${i}] = this.value; }">`;
            container.appendChild(div);
        }
    }

    function populateAuditFromState() {
        const p = getActivePharmacy();
        if (!p) return;

        const audit = getActiveAudit(p);
        if (!audit) return;

        if (audit.configuracion && audit.configuracion.puestosSelector) {
            document.getElementById('puestosSelector').value = audit.configuracion.puestosSelector;
            updateAuditUI();
        } else {
            document.getElementById('puestosSelector').value = "";
            document.getElementById('puestosContainer').innerHTML = "";
        }

        document.getElementById('checkSAI').checked = !!(audit.configuracion && audit.configuracion.checkSAI);
        document.getElementById('numImpDoc').value = (audit.configuracion && audit.configuracion.numImpDoc) || "1";
        document.getElementById('numImpTicket').value = (audit.configuracion && audit.configuracion.numImpTicket) || "1";
        updatePrintersUI();

        if (audit.opcionalesChecks) {
            for (const [k, v] of Object.entries(audit.opcionalesChecks)) {
                const chk = document.getElementById(k);
                if (chk) chk.checked = !!v;
            }
        }
        toggleOptionalFields();
    }

    function renderGlobalTimeline(area) {
        let allVisits = [];
        appState.pharmacies.forEach(f => {
            if (f.visitas && Array.isArray(f.visitas)) {
                f.visitas.forEach(v => {
                    allVisits.push({
                        ...v,
                        pharmacyId: f.id,
                        pharmacyName: f.nombre || 'Farmacia sin nombre'
                    });
                });
            }
        });

        allVisits.sort(compareVisitsDesc);

        if (allVisits.length === 0) {
            area.innerHTML = '';
            return;
        }

        let globalVisitsHtml = allVisits.map(v => `
            <div class="visit-card">
                <div class="visit-header">
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">

                    </div>
                </div>
                <div style="font-size: 0.9rem; font-weight: 700; color: var(--text-main);">
                    <a class="plain-text-link" onclick="selectPharmacyFromTimeline('${v.pharmacyId}')">
                        ${v.pharmacyName}
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>

        appState.selectedPharmacyId = String(id);
        switchMainTab('details');
    }

    async function toggleAdminLock() {
        if (appState.adminUnlocked) {
            appState.adminUnlocked = false;
            renderWorkspace();
        } else {
            const pass = prompt("Introduce la clave para editar datos maestros:");
            if (pass === null) return;
            if (await verifyHash(pass, H_ADMIN)) {
                appState.adminUnlocked = true;
                renderWorkspace();
            } else {
                alert("Clave incorrecta.");
            }
        }
    }

    async function togglePharmacyService(id, serviceType) {
        if (!appState.adminUnlocked) {
            return;
        }
        const p = appState.pharmacies.find(x => String(x.id) === String(id));
        if (!p) return;
        if (serviceType === 'logistica') {
            p.logistica = !p.logistica;
        } else if (serviceType === 'informatica') {
            p.informatica = !p.informatica;
        }

        // Mirror in hefame_informatica field for backwards compatibility
        if (p.logistica && p.informatica) p.hefame_informatica = 'Ambos';
        else if (p.logistica) p.hefame_informatica = 'Cliente Logística';
        else if (p.informatica) p.hefame_informatica = 'Cliente Software';
        else p.hefame_informatica = '';

        updateTopBarPharmacySelect();
        markUnsavedChanges();
        renderWorkspace();
        if (mapInstance) {
            renderUnifiedMarkers();
            updateMapCounters();
        }
        showCheckPopup();
    }

    function deletePharmacy(id) {
        if (!appState.adminUnlocked) {
            alert("Acción bloqueada: Requiere modo administrador.");
            return;
        }
        if (confirm("¿Estás seguro de eliminar esta farmacia del catálogo?")) {
            appState.pharmacies = appState.pharmacies.filter(x => String(x.id) !== String(id));
            appState.selectedPharmacyId = null;
            markUnsavedChanges();
            updateTopBarPharmacySelect();
            renderWorkspace();
            if (mapInstance) renderUnifiedMarkers();

    function saveNewVisitFromModal(pharmacyId, modalId) {
        const p = appState.pharmacies.find(x => String(x.id) === String(pharmacyId));
        if (!p) return;

        const selectedDate = document.getElementById(modalId + '_fecha').value || new Date().toISOString().split('T')[0];
        const selectedTime = document.getElementById(modalId + '_hora').value || "";
        
        let rawSelected = [];
        visitTypesList.forEach((_, idx) => {
            const chk = document.getElementById(`${modalId}_type_${idx}`);
            if (chk && chk.checked) {
                rawSelected.push(chk.value);
            }
        });

        let finalTypeStr = 'Visita: Comercial informativa';
        if (rawSelected.length > 0) {
            let cleaned = rawSelected.map(t => t.replace(/^Visita:\s*/i, ''));
            finalTypeStr = 'Visita: ' + cleaned.join('. ') + '.';
        }

        const summaryText = document.getElementById(modalId + '_resumen').value;

        if (!p.visitas) p.visitas = [];
        p.visitas.push({ id: Date.now(), fecha: selectedDate, hora: selectedTime, tipo: finalTypeStr, resumen: summaryText });

        markUnsavedChanges();
        document.getElementById(modalId).remove();
        renderWorkspace();
    }

    function editVisitSummaryModal(pharmacyId, visitId) {
        const p = appState.pharmacies.find(x => String(x.id) === String(pharmacyId));
        if (!p || !p.visitas) return;
        const v = p.visitas.find(item => String(item.id) === String(visitId));
        if (!v) return;

        const modalId = 'modalEditSummary_' + Date.now();
        
        let checkboxesHtml = visitTypesList.map((type, idx) => {
            let typeClean = type.replace(/^Visita:\s*/i, '').toLowerCase();
            let vTipoLower = (v.tipo || '').toLowerCase();
            let isChecked = vTipoLower.includes(typeClean);
            return `
                <div class="checkbox-group" style="margin-bottom: 6px;">
                    <input type="checkbox" id="${modalId}_type_${idx}" value="${type}" ${isChecked ? 'checked' : ''}>
                    <label for="${modalId}_type_${idx}">${type}</label>
                </div>
            `;
        }).join('');

        const modalDiv = document.createElement('div');
        modalDiv.className = 'modal-overlay';
        modalDiv.id = modalId;
        modalDiv.innerHTML = `
            <div class="modal-content">
                <div class="section-title" style="margin-bottom: 14px;"><span>Editar Visita</span></div>
                <div class="grid-2" style="margin-bottom: 14px;">
                    <div class="field-group">
                        <label>Fecha</label>
                        <input type="date" id="${modalId}_fecha" value="${v.fecha || ''}">
                    </div>
                    <div class="field-group">
                        <label>Hora</label>
                        <input type="time" id="${modalId}_hora" value="${v.hora || ''}">
                    </div>
                </div>
                <div class="field-group" style="margin-bottom: 14px;">
                    <label>Tipos de Visita (Selección múltiple)</label>
                    <div class="custom-scrollbar" style="max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 4px;">
                        ${checkboxesHtml}
                    </div>
                </div>
                <div class="field-group" style="margin-bottom: 18px;">
                    <label>Resumen / Observaciones</label>
                    <textarea id="${modalId}_resumen" rows="4">${v.resumen || ''}</textarea>
                </div>
                <div style="display: flex; gap: 10px; justify-content: flex-end;">
                    <button type="button" class="btn-dark" onclick="document.getElementById('${modalId}').remove()">Cancelar</button>
                    <button type="button" class="btn-light" onclick="saveEditedVisitFromModal('${pharmacyId}', '${visitId}', '${modalId}')">Guardar Cambios</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
    }

    function saveEditedVisitFromModal(pharmacyId, visitId, modalId) {
        const p = appState.pharmacies.find(x => String(x.id) === String(pharmacyId));
        if (!p || !p.visitas) return;
        const v = p.visitas.find(item => String(item.id) === String(visitId));
        if (v) {
            v.fecha = document.getElementById(modalId + '_fecha').value || v.fecha;
            v.hora = document.getElementById(modalId + '_hora').value || "";
            
            let rawSelected = [];
            visitTypesList.forEach((_, idx) => {
                const chk = document.getElementById(`${modalId}_type_${idx}`);
                if (chk && chk.checked) {
                    rawSelected.push(chk.value);
                }
            });

            if (rawSelected.length > 0) {
                let cleaned = rawSelected.map(t => t.replace(/^Visita:\s*/i, ''));
                v.tipo = 'Visita: ' + cleaned.join('. ') + '.';
            }
            v.resumen = document.getElementById(modalId + '_resumen').value;
            markUnsavedChanges();
        }
        document.getElementById(modalId).remove();
        renderWorkspace();
    }

    function deleteVisit(pharmacyId, visitId) {
        const p = appState.pharmacies.find(x => String(x.id) === String(pharmacyId));
        if (p && p.visitas) {
            p.visitas = p.visitas.filter(v => String(v.id) !== String(visitId));
            markUnsavedChanges();
            renderWorkspace();
        }
    }

    function clearForm() {
        const p = getActivePharmacy();
        if (!p) {
            alert("No hay ninguna farmacia seleccionada para limpiar.");
            return;
        }
        if (!confirm(`¿Limpiar visitas, auditorías y datos comerciales de "${p.nombre || 'esta farmacia'}"? (Se conservarán los datos base del censo)`)) {
            return;
        }
        p.fecha_visita = "";
        p.logistica = false;
        p.informatica = false;
        p.codigo_logistica = "";
        p.codigo_informatica = "";
        p.codigo_cliente = "";
        p.hefame_informatica = "";
        p.software = "";
        p.distribuidor = "";
        p.agrupacion = "";
        p.observaciones = "";
        p.auditorias = [createBlankAuditObject()];
        p.selectedAuditIndex = 0;
        p.visitas = [];
        markUnsavedChanges();
        updateTopBarPharmacySelect();
        updateMapCounters();
        if (mapInstance) renderUnifiedMarkers();
        renderWorkspace();
    }

    function updateActionButtonsState() {
        const isEmp = !!appState.enterpriseUnlocked;
        ['btnActionLoad', 'btnActionSave', 'btnActionClear', 'btnActionPrint'].forEach(id => {
            const btn = document.getElementById(id);
            if (btn) {
                btn.disabled = !isEmp;
                btn.title = isEmp ? '' : 'Requiere activar Modo Empresa';
            }
        });
    }
    window.updateActionButtonsState = updateActionButtonsState;

    function hasPharmacyUserData(f) {
        if (!f) return false;
        const hasVisits = Array.isArray(f.visitas) && f.visitas.length > 0;
        if (!appState.enterpriseUnlocked) return hasVisits;
        const hasObs = Boolean(f.observaciones && f.observaciones.trim() !== "");
        const hasCorp = f.logistica || f.informatica || f.codigo_logistica || f.codigo_informatica ||
                        f.software || f.distribuidor || f.agrupacion ||
                        (Array.isArray(f.auditorias) && f.auditorias.some(a => a.configuracion && a.configuracion.puestosSelector && a.configuracion.puestosSelector !== ""));
        return hasVisits || hasObs || Boolean(hasCorp);
    }

    async function saveJSON() {
        if (!appState.enterpriseUnlocked) {
            alert("Debes activar el Modo Empresa para guardar datos.");
            return;
        }
        const validPharmacies = appState.pharmacies.filter(f => hasPharmacyUserData(f)).map(f => {
            const normSoft = normalizeSoftwareValue(f.software || "");
            const normDist = normalizeDistributorValue(f.distribuidor || "");
            f.software = normSoft;
            f.distribuidor = normDist;
            const realAudits = Array.isArray(f.auditorias) ? f.auditorias.filter(a => a.configuracion && a.configuracion.puestosSelector && a.configuracion.puestosSelector !== "") : [];
            const item = {
                id: f.id,
                nombre: f.nombre,
                visitas: f.visitas || []
            };
            if (f.titular && f.titular !== f.nombre) item.titular = f.titular;
            if (f.cif) item.cif = f.cif;
            if (f.codigo_oficial && f.codigo_oficial !== f.id) item.codigo_oficial = f.codigo_oficial;
            if (f.direccion) item.direccion = f.direccion;
            if (f.localidad) item.localidad = f.localidad;
            if (f.zona) item.zona = f.zona;
            if (f.lat !== undefined && f.lat !== null) item.lat = f.lat;
            if (f.lng !== undefined && f.lng !== null) item.lng = f.lng;
            if (f.telefono) item.telefono = f.telefono;
            if (f.email) item.email = f.email;
            if (f.logistica) item.logistica = true;
            if (f.informatica) item.informatica = true;
            if (f.codigo_logistica) item.codigo_logistica = f.codigo_logistica;
            if (f.codigo_informatica) item.codigo_informatica = f.codigo_informatica;
            if (normSoft) item.software = normSoft;
            if (normDist) item.distribuidor = normDist;
            if (f.agrupacion) item.agrupacion = f.agrupacion;
            if (f.observaciones && f.observaciones.trim() !== "") item.observaciones = f.observaciones;
            if (realAudits.length > 0) item.auditorias = realAudits;
            return item;
        });

        const globalData = {
            tecnicoGlobal: appState.globalTechnician,
            farmacias: validPharmacies
        };
        const jsonString = JSON.stringify(globalData, null, 2);
        
        let techClean = appState.globalTechnician 
            ? appState.globalTechnician.replace(/\s*-\s*\d{4}-\d{2}-\d{2}.*/g, '').replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ_\-\s]/g, '').trim() 
            : 'Usuario';
        let todayStr = new Date().toISOString().split('T')[0];
        let filename = `${techClean} - Gestion_Farmacias - ${todayStr}.json`;
        
        if ('showSaveFilePicker' in window) {
            try {
                const opts = {
                    suggestedName: filename,
                    types: [{
                        description: 'Archivo JSON',
                        accept: { 'application/json': ['.json'] }
                    }],
                };
                const handle = await window.showSaveFilePicker(opts);
                const writable = await handle.createWritable();
                await writable.write(jsonString);
                await writable.close();
                appState.hasUnsavedChanges = false;
                showCheckPopup();
                return;
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('Error using showSaveFilePicker:', err);
                } else {
                    return;
                }
            }
        }

        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
        appState.hasUnsavedChanges = false;
        showCheckPopup();
    }

    function showCheckPopup() {
        const popup = document.createElement('div');
        popup.className = 'success-popup';
        popup.innerHTML = '&#10004;';
        document.body.appendChild(popup);
        setTimeout(() => popup.remove(), 1300);
    }

    function loadJSON(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;

        let processedCount = 0;
        let newlyLoadedPharmacies = [];

        Array.from(files).forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const loadedData = JSON.parse(e.target.result);
                    if (loadedData) {
                        const rawList = loadedData.farmacias || loadedData.pharmacies || (Array.isArray(loadedData) ? loadedData : null);
                        if (Array.isArray(rawList)) {
                            if (loadedData.tecnicoGlobal && !appState.globalTechnician) {
                                appState.globalTechnician = loadedData.tecnicoGlobal;
                                const tInput = document.getElementById('globalTechnicianInput');
                                if (tInput) tInput.value = loadedData.tecnicoGlobal;
                            }
                            rawList.forEach(f => {
                                ensureAuditStructure(f);
                                newlyLoadedPharmacies.push(f);
                            });
                        } else if (typeof loadedData === 'object' && loadedData !== null) {
                            // Support corporate data overlay file (e.g. HefameEmpresaDatos.json)
                            mergeCorporateData(loadedData);
                            appState.enterpriseUnlocked = true;
                            if (typeof window.renderAuthContainer === 'function' && window.firebaseAuth) {
                                window.renderAuthContainer(window.firebaseAuth.currentUser);
                            }
                            newlyLoadedPharmacies.push({ id: '__corporate_overlay__' });
                        }
                    }
                } catch (err) {
                    console.error("Error processing JSON file:", err);
                }

                processedCount++;
                if (processedCount === files.length) {
                    if (newlyLoadedPharmacies.length > 0) {
                        newlyLoadedPharmacies.forEach(nf => {
                            if (nf.id !== '__corporate_overlay__') {
                                mergeIncomingPharmacy(nf);
                            }
                        });
                        appState.hasUnsavedChanges = false;
                        showCheckPopup();
                        if (typeof updateMapCounters === 'function') updateMapCounters();
                        renderWorkspace();
                    } else {
                        alert("El archivo no contiene un formato de farmacias válido.");
                    }
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        });
    }

    window.addEventListener('beforeunload', (e) => {
        if (appState.hasUnsavedChanges) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    window.onload = function() {
        if (appState.pharmacies.length === 0) {
            initMasterPharmacies();
        }
        appState.selectedPharmacyId = null;
        switchMainTab('map');
        updateActionButtonsState();
        initHeaderMoleculesAnimation();
    };
</script>

</body>
